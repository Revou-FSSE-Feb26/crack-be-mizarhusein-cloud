services:
  postgres:
    image: postgres:16-alpine
    container_name: saluna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saluna
      POSTGRES_PASSWORD: saluna
      POSTGRES_DB: saluna_db
    ports:
      - "5432:5432"
    volumes:
      - saluna_postgres_data:/var/lib/postgresql/data

volumes:
  saluna_postgres_data:
